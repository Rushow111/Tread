name: Rebuild futures history baseline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures-history-rebuild
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and aggregate complete market history
        run: node scripts/sync-futures-data.mjs

      - name: Validate generated dataset
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("public/data/futures.json", "utf8"));
          if (!Array.isArray(data.assets) || data.assets.length < 50) {
            throw new Error(`Expected at least 50 assets, got ${data.assets?.length}`);
          }
          for (const asset of data.assets) {
            if (!asset.series?.length) throw new Error(`${asset.id}: empty series`);
          }
          console.log(`Validated ${data.assets.length} assets through ${data.asOf}`);
          NODE

      - name: Commit refreshed baseline
        run: |
          git config user.name "tread-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/futures.json
          git diff --cached --quiet && exit 0
          git commit -m "data: rebuild futures history baseline"
          git push
