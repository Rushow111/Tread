name: Update all-history close metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
    - cron: '53 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-close-metrics.yml'
      - 'scripts/update-close-metrics.mjs'
      - 'scripts/trimmed-range.mjs'
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0
      - run: node scripts/update-close-metrics.mjs
      - name: Publish calculated daily-close metrics
        run: |
          cp public/data/close-metrics.json "$RUNNER_TEMP/close-metrics.json"
          git restore public/data/close-metrics.json
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/close-metrics.json" public/data/close-metrics.json
          git config user.name 'tread-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/close-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: recompute all-history trimmed close metrics'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Failed to publish market data after three attempts' >&2
          exit 1
