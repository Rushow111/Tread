name: Update all-history daily-low metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
    - cron: '53 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-close-metrics.yml'
      - 'scripts/update-low-metrics.mjs'
      - 'scripts/trimmed-range.mjs'
permissions:
  contents: write
concurrency:
  group: market-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0
      - run: node scripts/update-low-metrics.mjs
      - name: Validate calculated daily-low metrics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('public/data/low-metrics.json', 'utf8'));
          const status = data.status ?? {};
          const rows = data.assets ?? {};
          if (!/^\d{4}-\d{2}-\d{2}$/.test(data.asOf ?? '')) throw new Error('Invalid metrics asOf date');
          if (!Number.isFinite(status.total) || status.total < 6500) throw new Error(`Unexpected metric registry size: ${status.total}`);
          if (status.processed !== status.total) throw new Error(`Metrics processing incomplete: ${status.processed}/${status.total}`);
          if (Object.keys(rows).length !== status.total) throw new Error(`Metrics row count mismatch: ${Object.keys(rows).length}/${status.total}`);
          if (!Number.isFinite(status.eligible) || status.eligible < 3000) throw new Error(`Too few eligible metrics: ${status.eligible}`);
          const maxErrors = Math.max(10, Math.ceil(status.total * 0.005));
          if (!Number.isFinite(status.errors) || status.errors > maxErrors) {
            const examples = (status.failedAssets ?? []).slice(0, 12).map(item => `${item.id}: ${item.error}`).join('; ');
            throw new Error(`Too many daily-low collection errors: ${status.errors}/${status.total} (limit ${maxErrors}). ${examples}`);
          }
          if ((status.failedAssets ?? []).length !== status.errors) {
            throw new Error(`Failure diagnostics mismatch: ${status.failedAssets?.length ?? 0}/${status.errors}`);
          }
          console.log(`Validated ${status.processed}/${status.total}; eligible ${status.eligible}; source errors ${status.errors}`);
          NODE
      - name: Publish calculated daily-low metrics
        run: |
          cp public/data/low-metrics.json "$RUNNER_TEMP/low-metrics.json"
          git restore public/data/low-metrics.json 2>/dev/null || true
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/low-metrics.json" public/data/low-metrics.json
          git config user.name 'tread-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/low-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: recompute all-history trimmed daily-low metrics'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Failed to publish market data after three attempts' >&2
          exit 1
