name: Update all-history close metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
    - cron: '53 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-close-metrics.yml'
      - 'scripts/update-close-metrics.mjs'
      - 'scripts/trimmed-range.mjs'
permissions:
  contents: write
concurrency:
  group: all-history-close-metrics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0
      - run: node scripts/update-close-metrics.mjs
      - name: Publish calculated daily-close metrics
        run: |
          git config user.name 'tread-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/close-metrics.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: recompute all-history trimmed close metrics'
          git pull --rebase origin main
          git push
