name: Probe official futures sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-official-sources.yml"
      - "scripts/probe_sources.py"

permissions:
  contents: read

jobs:
  probe:
    name: Probe six official markets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official endpoints
        run: python scripts/probe_sources.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-connectivity
          path: reports/connectivity.json
          if-no-files-found: error
          retention-days: 14
