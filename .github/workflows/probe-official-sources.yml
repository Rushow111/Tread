name: Probe official futures sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-official-sources.yml"
      - "scripts/probe_sources.py"

permissions:
  contents: read

jobs:
  probe:
    name: Probe six official markets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official endpoints
        run: python scripts/probe_sources.py

      - name: Force IPv4 for DCE and CFFEX
        if: always()
        shell: bash
        run: |
          set +e
          for item in \
            "DCE|https://www.dce.com.cn/dce/channel/list/168.html" \
            "CFFEX|https://www.cffex.com.cn/cn/lssjxz.html"
          do
            name="${item%%|*}"
            url="${item#*|}"
            code=$(curl -4 -L --connect-timeout 10 --max-time 30 \
              -A "Mozilla/5.0 (compatible; TreadOfficialDataProbe/1.0)" \
              -o "/tmp/${name}.body" -sS -w "%{http_code}" "$url")
            bytes=$(wc -c < "/tmp/${name}.body" 2>/dev/null || echo 0)
            echo "${name} IPv4 status=${code} bytes=${bytes}"
          done

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-connectivity
          path: reports/connectivity.json
          if-no-files-found: error
          retention-days: 14
