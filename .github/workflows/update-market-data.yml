name: Update daily market data

on:
  workflow_dispatch:
  schedule:
    # Primary refresh: 10:17 Beijing time. The second slot is a fallback for
    # delayed or dropped GitHub scheduled events and skips when the first run
    # already produced a healthy refresh.
    - cron: "17 2 * * *"
    - cron: "47 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-market-data.yml"
      - "scripts/update-daily-market-data.mjs"
      - "data/futures-registry.json"
      - "data/us-stock-seed.json.gz"

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check whether a healthy refresh already ran
        id: freshness
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          function read(path) {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); }
            catch { return null; }
          }

          const futures = read("public/data/daily-futures.json");
          const stocks = read("public/data/daily-stocks.json");
          const timestamps = [futures?.generatedAt, stocks?.generatedAt]
            .map((value) => Date.parse(value))
            .filter(Number.isFinite);
          const youngestAge = timestamps.length === 2
            ? Date.now() - Math.min(...timestamps)
            : Number.POSITIVE_INFINITY;
          const healthy =
            Array.isArray(futures?.status?.failures) && futures.status.failures.length === 0 &&
            stocks?.status?.failedBatches === 0;
          const skip = healthy && youngestAge < 12 * 60 * 60 * 1000;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          console.log(skip
            ? "A healthy refresh completed within the last 12 hours; skipping this fallback run."
            : "Dataset is stale or incomplete; running the refresh.");
          NODE

      - name: Install WebSocket client
        if: steps.freshness.outputs.skip != 'true'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0

      - name: Validate updater
        if: steps.freshness.outputs.skip != 'true'
        run: node scripts/update-daily-market-data.mjs --self-test

      - name: Download latest completed daily prices
        if: steps.freshness.outputs.skip != 'true'
        run: node scripts/update-daily-market-data.mjs

      - name: Validate daily datasets
        if: steps.freshness.outputs.skip != 'true'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const futures = JSON.parse(fs.readFileSync("public/data/daily-futures.json", "utf8"));
          const stocks = JSON.parse(fs.readFileSync("public/data/daily-stocks.json", "utf8"));
          if (futures.status.registryCount !== 217) throw new Error("Futures registry is incomplete");
          if (!Array.isArray(futures.assets) || futures.assets.length < 80) throw new Error("Too few futures received a daily update");
          if (!Array.isArray(stocks.stocks) || stocks.stocks.length < 6000) throw new Error("Stock registry is incomplete");
          for (const asset of futures.assets) {
            for (const [date, low, high] of asset.series) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(low) || !Number.isFinite(high) || low > high) {
                throw new Error(`${asset.id}: invalid daily point`);
              }
            }
          }
          for (const [id, , date, low, high, historicalLow, historicalHigh] of stocks.stocks) {
            if (!date || ![low, high, historicalLow, historicalHigh].every(Number.isFinite) || low > high || historicalLow > historicalHigh) {
              throw new Error(`${id}: invalid stock summary`);
            }
          }
          console.log(`Validated futures through ${futures.asOf} and stocks through ${stocks.asOf}`);
          NODE

      - name: Commit refreshed data
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "tread-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/daily-futures.json public/data/daily-stocks.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update daily market prices"
          git push
