name: Update daily market data

on:
  workflow_dispatch:
  schedule:
    # Run both slots: an HTTP success or a recent file timestamp is not proof of fresh prices.
    - cron: "17 2 * * *"
    - cron: "47 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-market-data.yml"
      - "scripts/update-daily-market-data.mjs"
      - "data/futures-registry.json"
      - "data/us-stock-seed.json.gz"

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WebSocket client
        run: npm install --no-save --ignore-scripts --no-audit --no-fund ws@8.18.0

      - name: Validate updater
        run: node scripts/update-daily-market-data.mjs --self-test

      - name: Download latest completed daily prices
        run: node scripts/update-daily-market-data.mjs

      - name: Validate daily datasets
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const futures = JSON.parse(fs.readFileSync("public/data/daily-futures.json", "utf8"));
          const stocks = JSON.parse(fs.readFileSync("public/data/daily-stocks.json", "utf8"));

          const ratio = (value, total) => total > 0 ? value / total : 0;
          const subtractDays = (date, days) => {
            const value = new Date(`${date}T00:00:00Z`);
            value.setUTCDate(value.getUTCDate() - days);
            return value.toISOString().slice(0, 10);
          };

          if (futures.status.registryCount !== 217) throw new Error("Futures registry is incomplete");
          if (!Array.isArray(futures.assets)) throw new Error("Futures dataset is malformed");
          if (futures.assets.length !== futures.status.updatedAssetCount) {
            throw new Error("Futures status count does not match the dataset");
          }
          const futuresCoverage = ratio(futures.status.updatedAssetCount, futures.status.registryCount);
          if (futuresCoverage < 0.95) {
            throw new Error(`Futures coverage too low: ${(futuresCoverage * 100).toFixed(2)}%`);
          }
          if ((futures.status.failures ?? []).length > 0) {
            throw new Error(`A futures source failed completely: ${futures.status.failures.join("; ")}`);
          }

          if (!Array.isArray(stocks.stocks)) throw new Error("Stock dataset is malformed");
          if (stocks.stocks.length !== stocks.status.registryCount) {
            throw new Error(`Stock registry/output mismatch: ${stocks.stocks.length}/${stocks.status.registryCount}`);
          }
          const stockUpdateCoverage = ratio(stocks.status.updatedQuotes, stocks.status.registryCount);
          if (stockUpdateCoverage < 0.99) {
            throw new Error(`Too few stocks refreshed this run: ${stocks.status.updatedQuotes}/${stocks.status.registryCount}`);
          }
          if (stocks.status.failedBatches > 1) {
            throw new Error(`Too many Yahoo stock batches failed: ${stocks.status.failedBatches}/${stocks.status.totalBatches}`);
          }

          for (const asset of futures.assets) {
            if (!Array.isArray(asset.series) || asset.series.length === 0) {
              throw new Error(`${asset.id}: empty futures series`);
            }
            for (const [date, low, high] of asset.series) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(low) || !Number.isFinite(high) || low > high) {
                throw new Error(`${asset.id}: invalid daily point`);
              }
            }
          }

          const recentCutoff = subtractDays(futures.asOf, 7);
          const recentFutures = futures.assets.filter((asset) => asset.series.at(-1)?.[0] >= recentCutoff).length;
          const recentFuturesCoverage = ratio(recentFutures, futures.status.registryCount);
          if (recentFuturesCoverage < 0.90) {
            throw new Error(`Too many stale futures series: ${recentFutures}/${futures.status.registryCount} recent within 7 days`);
          }

          for (const [id, , date, low, high, historicalLow, historicalHigh] of stocks.stocks) {
            if (!date || ![low, high, historicalLow, historicalHigh].every(Number.isFinite) || low > high || historicalLow > historicalHigh) {
              throw new Error(`${id}: invalid stock summary`);
            }
          }

          console.log(
            `Validated futures ${futures.status.updatedAssetCount}/${futures.status.registryCount} ` +
            `(${(futuresCoverage * 100).toFixed(2)}%, ${recentFutures} recent) through ${futures.asOf}; ` +
            `stocks ${stocks.status.updatedQuotes}/${stocks.status.registryCount} ` +
            `(${(stockUpdateCoverage * 100).toFixed(2)}%) through ${stocks.asOf}`,
          );
          NODE

      - name: Commit refreshed data
        run: |
          mkdir -p "$RUNNER_TEMP/price-atlas-data"
          cp public/data/daily-futures.json "$RUNNER_TEMP/price-atlas-data/daily-futures.json"
          cp public/data/daily-stocks.json "$RUNNER_TEMP/price-atlas-data/daily-stocks.json"
          git restore public/data/daily-futures.json public/data/daily-stocks.json
          git pull --ff-only origin main
          cp "$RUNNER_TEMP/price-atlas-data/daily-futures.json" public/data/daily-futures.json
          cp "$RUNNER_TEMP/price-atlas-data/daily-stocks.json" public/data/daily-stocks.json
          git config user.name "tread-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/daily-futures.json public/data/daily-stocks.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update daily market prices"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'Failed to publish market data after three attempts' >&2
          exit 1
